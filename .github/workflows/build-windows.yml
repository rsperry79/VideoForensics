name: Build Windows

# Reusable: restores NuGet packages, builds the test solution and, on dev and main pushes, publishes the apps that the
# release packages. The release downloads these outputs from this run and never publishes again.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # VideoForensics.CI.slnf excludes VideoForensics.Client.MauiApp.csproj (MAUI needs Windows workloads and a win-x64
      # RuntimeIdentifier, which this gate does not set) and keeps to the cross-platform library and test projects.
      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          key: nuget-cache-windows-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          path: ~/.nuget/packages

      - name: Restore NuGet packages
        run: dotnet restore VideoForensics.CI.slnf

      - name: Build solution
        shell: bash
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: dotnet build VideoForensics.CI.slnf --configuration Release --no-restore -p:SyncfusionLicenseKey="$SYNCFUSION_LICENSE_KEY"

      # Publish once here for dev and main pushes. The release packages these outputs, so it does not rebuild them.
      - name: Publish WebApp (win-x64, self-contained)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: >
          dotnet publish src/client/web/VideoForensics.WebApp/src/VideoForensics.Client.WebApp.csproj
          -c Release -r win-x64 --self-contained true -p:SyncfusionLicenseKey="$SYNCFUSION_LICENSE_KEY" -o publish-win

      - name: Publish MauiApp (win-x64, self-contained)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: >
          dotnet publish src/client/maui/VideoForensics.Client.MauiApp/src/VideoForensics.Client.MauiApp.csproj
          -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:SyncfusionLicenseKey="$SYNCFUSION_LICENSE_KEY" -o publish-desktop

      - name: Publish DbSetup (win-x64, self-contained)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        run: >
          dotnet publish src/utils/dbsetup/src/VideoForensics.Utils.DbSetup.csproj
          -c Release -r win-x64 --self-contained true -o publish-dbsetup

      - name: Publish WebApp (linux-x64, self-contained)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: >
          dotnet publish src/client/web/VideoForensics.WebApp/src/VideoForensics.Client.WebApp.csproj
          -c Release -r linux-x64 --self-contained true -p:SyncfusionLicenseKey="$SYNCFUSION_LICENSE_KEY" -o publish-linux

      - name: Archive publish outputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        run: |
          tar -cf windows-publish.tar publish-win publish-desktop publish-dbsetup
          tar -cf linux-publish.tar publish-linux

      - name: Upload Windows publish output
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish
          path: windows-publish.tar

      - name: Upload Linux publish output
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: linux-publish
          path: linux-publish.tar

      # Hand the compiled output to test-windows as one tar, so every file keeps its exact repo-relative path.
      # upload-artifact would store paths relative to their common ancestor and could place files wrongly.
      - name: Archive build output
        shell: bash
        run: find . -type d \( -name bin -o -name obj \) -prune -print | tar -cf build-output.tar -T -

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar
