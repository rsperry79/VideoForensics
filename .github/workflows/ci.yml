name: CI - Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  # Windows is the only test host: Windows-only tests (named pipes, DPAPI, platform directories, Windows path
  # handling) run here on every PR rather than being skipped on a Linux runner.
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          key: nuget-cache-windows-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          path: ~/.nuget/packages

      - name: Restore
        run: dotnet restore VideoForensics.CI.slnf

      - name: Build
        run: dotnet build VideoForensics.CI.slnf --configuration Release --no-restore

      - name: Test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          dotnet test VideoForensics.CI.slnf --configuration Release --no-build
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && success()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
