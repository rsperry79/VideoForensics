name: CI - Build and Test

on:
  push:
    branches: [ main, wip ]
  pull_request:
    branches: [ main, wip ]

permissions:
  contents: read

jobs:
  build-and-test:
    # windows-latest, not ubuntu-latest: VideoForensics.MauiApp.csproj targets
    # net10.0-windows10.0.19041.0 and cannot restore/build without Windows-only
    # MAUI workloads that aren't available on Linux runners.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VideoForensics.sln

      - name: Build
        run: dotnet build VideoForensics.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VideoForensics.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
