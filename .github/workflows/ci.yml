name: CI - Build and Test

# Orchestrates the stages. Each stage is a reusable workflow in this folder, so each file is read on its own.
#   check-dependencies  (PR only)     check-dependencies.yml   dependency review, parallel with the build
#   build-windows                     build-windows.yml        restore and build the solution
#   test-windows                      test-windows.yml         run the tests against the build output
#   determine-version   (dev/main)    determine-version.yml    read the NBGV version
#   publish-packages    (dev/main)    pack-nuget-packages.yml  pack and push NuGet packages to GitHub Packages
#   publish-releases    (dev/main)    release-installers.yml   build installers and create the GitHub release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  check-dependencies:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/check-dependencies.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  test-windows:
    needs: [build-windows]
    uses: ./.github/workflows/test-windows.yml
    secrets: inherit

  # Publishing runs only after the tests pass, and only for pushes to dev or main. Pull requests never publish.
  determine-version:
    needs: [test-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/determine-version.yml

  publish-packages:
    needs: [determine-version]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pack-nuget-packages.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit

  # Installers and the GitHub release reuse release-installers.yml. It creates a prerelease for dev and a release for main.
  publish-releases:
    needs: [test-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: ./.github/workflows/release-installers.yml
    secrets: inherit
