name: CI - Build, Test and Publish

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

# Only PR runs are superseded by newer pushes; dev and tag runs must finish so a publish is never cancelled mid-upload.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # VideoForensics.CI.slnf excludes VideoForensics.MauiApp.csproj (targets
      # net10.0-windows10.0.19041.0, needs Windows-only MAUI workloads and an
      # explicit win-x64 RuntimeIdentifier to restore/build - out of scope for
      # this build+test gate, which only needs the cross-platform library and
      # test projects) and VideoForensics.Providers.Ring.Core.Tests (its whole
      # fixture requires live Ring account credentials stored in a local dev
      # database - not something a CI runner has; see its own failure message:
      # "Run 'dotnet run -- --auth' from src/selftest to authenticate").
      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          key: nuget-cache-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          path: ~/.nuget/packages

      - name: Restore
        run: dotnet restore VideoForensics.CI.slnf

      - name: Build
        run: dotnet build VideoForensics.CI.slnf --configuration Release --no-restore

      # This repo opts into Microsoft.Testing.Platform (see Directory.Build.props),
      # so `dotnet test` routes through MTP's own CLI, not legacy VSTest - the
      # VSTest-style `--logger trx` flag silently breaks test discovery there
      # (every project reports "Zero tests ran"). Use MTP's native xUnit trx
      # reporter flag instead.
      #
      - name: Test
        run: >
          dotnet test VideoForensics.CI.slnf --configuration Release --no-build
          --report-xunit-trx --results-directory TestResults

      - name: Create build cache
        if: success()
        run: tar -czf build-cache-release.tar.gz $(find . -type d -name bin -o -type d -name obj)

      - name: Upload build cache
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-cache-ci-release
          path: build-cache-release.tar.gz

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && success()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4

  bump-version:
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        run: bash .github/scripts/bump-version.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'GitHub Actions'
          GIT_AUTHOR_EMAIL: 'noreply@github.com'
          GIT_COMMITTER_NAME: 'GitHub Actions'
          GIT_COMMITTER_EMAIL: 'noreply@github.com'

  build-debian-dev:
    needs: [build-and-test, bump-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # NBGV computes its version via an MSBuild TARGET that runs during actual build execution,
      # not via static property evaluation - `dotnet msbuild -getProperty:Version` only evaluates
      # properties without running targets, so it silently returns the .NET SDK's own default
      # "1.0.0" instead of the real computed version. The `nbgv` CLI tool computes it directly.
      #
      # For the Testing channel, prefer the merged PR number over git-height for version
      # traceability (e.g., 1.0.68 is easier to trace than 1.0.9.44078). Squash-merged PRs
      # have a commit message ending in (#NNN). Falls back to NBGV's height-based version
      # if no PR number can be extracted (e.g., direct push to dev without a PR).
      - name: Get NBGV-computed version
        id: get-version
        shell: bash
        run: |
          dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          MAJOR_MINOR=$(nbgv get-version -v MajorMinorVersion)
          COMMIT_MSG=$(git log -1 --format=%s)
          PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oP '\(#\K[0-9]+(?=\)\s*$)' || true)

          if [ -n "$PR_NUMBER" ]; then
            VERSION="$MAJOR_MINOR.$PR_NUMBER"
            echo "Detected version from PR #$PR_NUMBER: $VERSION"
          else
            VERSION=$(nbgv get-version -v Version)
            echo "No PR number found in commit message, falling back to NBGV height-based version: $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish WebApp (linux-x64, self-contained)
        run: |
          dotnet publish src/client/web/VideoForensics.WebApp \
            -c Release -r linux-x64 --self-contained true \
            -p:SyncfusionLicenseKey="${{ secrets.SYNCFUSION_LICENSE_KEY }}" \
            -o /tmp/publish-linux

      # Pinned to a specific cloudflared release (not `latest`) with a hardcoded SHA256, so a
      # compromised or altered upstream binary fails the build loudly instead of shipping
      # silently. Bump CLOUDFLARED_VERSION and recompute the hash deliberately to upgrade.
      - name: Download and bundle cloudflared binary
        env:
          CLOUDFLARED_VERSION: "2026.9.3"
          CLOUDFLARED_SHA256: "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2"
        run: |
          curl -fsSL -o /tmp/publish-linux/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/publish-linux/cloudflared" | sha256sum -c -
          chmod +x /tmp/publish-linux/cloudflared

      - name: Build Debian package
        run: |
          chmod +x deploy/debian/build-deb.sh
          ./deploy/debian/build-deb.sh /tmp/publish-linux "${{ steps.get-version.outputs.version }}"

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          cd deploy/debian
          sha256sum "videoforensics_${{ steps.get-version.outputs.version }}_amd64.deb" \
            > "videoforensics_${{ steps.get-version.outputs.version }}_amd64.deb.sha256"
          echo "Generated checksum file:"
          cat "videoforensics_${{ steps.get-version.outputs.version }}_amd64.deb.sha256"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-testing
          path: |
            deploy/debian/videoforensics_${{ steps.get-version.outputs.version }}_amd64.deb
            deploy/debian/videoforensics_${{ steps.get-version.outputs.version }}_amd64.deb.sha256

  build-windows-dev:
    needs: [build-and-test, bump-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # See the bash variant of this step (build-debian-dev job) for why nbgv replaces
      # `dotnet msbuild -getProperty:Version` here, and why the Testing channel uses PR numbers.
      - name: Get NBGV-computed version (PowerShell)
        id: get-version
        shell: pwsh
        run: |
          dotnet tool update --global nbgv
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $majorMinor = nbgv get-version -v MajorMinorVersion
          $commitMsg = git log -1 --format=%s

          if ($commitMsg -match '\(#(\d+)\)\s*$') {
            $prNumber = $matches[1]
            $version = "$majorMinor.$prNumber"
            Write-Host "Detected version from PR #$prNumber`: $version"
          } else {
            $version = nbgv get-version -v Version
            Write-Host "No PR number found in commit message, falling back to NBGV height-based version: $version"
          }

          Add-Content $env:GITHUB_OUTPUT "version=$version"

      - name: Publish WebApp (win-x64, self-contained)
        run: |
          dotnet publish src/client/web/VideoForensics.WebApp `
            -c Release -r win-x64 --self-contained true `
            -p:SyncfusionLicenseKey="${{ secrets.SYNCFUSION_LICENSE_KEY }}" `
            -o publish-win

      - name: Publish MauiApp (win-x64, self-contained)
        run: |
          dotnet publish src/client/maui/VideoForensics.MauiApp `
            -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true `
            -p:SyncfusionLicenseKey="${{ secrets.SYNCFUSION_LICENSE_KEY }}" `
            -o publish-desktop

      - name: Publish DbSetup (win-x64, self-contained)
        run: |
          dotnet publish src/utils/setup/VideoForensics.Utils.DbSetup.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish-dbsetup

      - name: Download and bundle FFmpeg binaries
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) "ffmpeg-btbn-$(Get-Random)"
          $publishDir = "publish-win"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          Write-Host "Downloading FFmpeg from $ffmpegUrl"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "$tempDir\ffmpeg.zip" -ErrorAction Stop

          Write-Host "Extracting to $tempDir"
          Expand-Archive -Path "$tempDir\ffmpeg.zip" -DestinationPath $tempDir -ErrorAction Stop

          $extractedDir = Get-ChildItem -Path $tempDir -Directory -ErrorAction Stop | Select-Object -First 1
          if (-not $extractedDir) {
            Write-Host "ERROR: No directory found in extracted archive"
            exit 1
          }

          $binDir = Join-Path $extractedDir.FullName "bin"
          if (-not (Test-Path $binDir)) {
            Write-Host "ERROR: bin directory not found at $binDir"
            exit 1
          }

          Write-Host "Copying ffmpeg.exe and ffprobe.exe to $publishDir"
          Copy-Item (Join-Path $binDir "ffmpeg.exe") "$publishDir\" -ErrorAction Stop
          Copy-Item (Join-Path $binDir "ffprobe.exe") "$publishDir\" -ErrorAction Stop

          Write-Host "Copying license file as ffmpeg-LICENSE.txt"
          $licenseFile = Get-ChildItem -Path $extractedDir.FullName -Filter "LICENSE*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($licenseFile) {
            Copy-Item $licenseFile.FullName "$publishDir\ffmpeg-LICENSE.txt" -ErrorAction Stop
            Write-Host "  - License: $(Split-Path -Leaf $licenseFile.FullName) -> ffmpeg-LICENSE.txt"
          } else {
            Write-Host "  WARNING: No LICENSE* file found in extracted archive"
          }

          Write-Host "FFmpeg binaries bundled successfully:"
          Get-ChildItem "$publishDir\ffmpeg*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }

          Write-Host "Cleaning up temporary directory"
          Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue

      # Pinned to a specific cloudflared release (not `latest`) with a hardcoded SHA256, so a
      # compromised or altered upstream binary fails the build loudly instead of shipping
      # silently. Bump the version and recompute the hash deliberately to upgrade.
      - name: Download and bundle cloudflared binary
        shell: pwsh
        run: |
          $cloudflaredVersion = "2026.9.3"
          $expectedHash = "F096265EC2FCBE9BB6E2D64268DB167CED3FCBB83D894BDB9E2FCDB26F2EA7E2"
          $cloudflaredUrl = "https://github.com/cloudflare/cloudflared/releases/download/$cloudflaredVersion/cloudflared-windows-amd64.exe"
          Write-Host "Downloading cloudflared $cloudflaredVersion from $cloudflaredUrl"
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile "publish-win\cloudflared.exe" -ErrorAction Stop
          $actualHash = (Get-FileHash -Path "publish-win\cloudflared.exe" -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            Write-Host "ERROR: cloudflared.exe hash mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }
          Write-Host "Bundled cloudflared.exe successfully (hash verified)"

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $serverDir = (Resolve-Path "publish-win").Path
          $desktopDir = (Resolve-Path "publish-desktop").Path
          $dbSetupDir = (Resolve-Path "publish-dbsetup").Path
          Write-Host "Compiling Inno Setup installer: version=$version server=$serverDir desktop=$desktopDir dbsetup=$dbSetupDir"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" deploy\windows\VideoForensics.iss `
            "/DAppVersion=$version" `
            "/DServerPublishDir=$serverDir" `
            "/DDesktopPublishDir=$desktopDir" `
            "/DDbSetupPublishDir=$dbSetupDir"

      - name: Locate built installer
        shell: pwsh
        run: |
          $exePath = "deploy/windows/bin/VideoForensicsSetup.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "ERROR: Setup exe not found at expected path: $exePath"
            Get-ChildItem "deploy/windows/bin" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Found: $exePath"

      # Self-signed code signing cert (see deploy/windows/codesign/README.md). This does NOT
      # give the installer OS-level trust/SmartScreen reputation - only a cert chained to a
      # public root CA does that. What it gives: tamper-evidence. Anyone can verify the
      # installer's signing certificate matches the public cert/thumbprint checked into this
      # repo (deploy/windows/codesign/VideoForensics-CodeSigning.cer), so a modified installer
      # (wrong signer, or unsigned) is detectable rather than silently trusted.
      - name: Sign installer with self-signed certificate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction Stop |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Host "ERROR: signtool.exe not found"
            exit 1
          }

          & $signtool sign /f $pfxPath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 `
            "deploy/windows/bin/VideoForensicsSetup.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: signtool sign failed with exit code $LASTEXITCODE"
            exit 1
          }

          Remove-Item $pfxPath -Force

          $sig = Get-AuthenticodeSignature -FilePath "deploy/windows/bin/VideoForensicsSetup.exe"
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer thumbprint: $($sig.SignerCertificate.Thumbprint)"
          if (-not $sig.SignerCertificate) {
            Write-Host "ERROR: no signer certificate found on signed exe"
            exit 1
          }
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}

      - name: Compute SHA256 checksum (Windows)
        shell: pwsh
        run: |
          $exePath = "deploy/windows/bin/VideoForensicsSetup.exe"
          $exeOut = "deploy/windows/bin/VideoForensicsSetup.exe.sha256"
          $exeHash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          "$exeHash  $(Split-Path -Leaf $exePath)" | Out-File -FilePath $exeOut -Encoding ASCII
          Write-Host "EXE checksum:"
          Get-Content $exeOut

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-testing
          path: |
            deploy/windows/bin/VideoForensicsSetup.exe
            deploy/windows/bin/VideoForensicsSetup.exe.sha256

  pack-and-push-nuget-dev:
    needs: [build-debian-dev, build-windows-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pack-nuget-packages.yml
    with:
      version: ${{ needs.build-debian-dev.outputs.version }}
      github-token: ${{ github.token }}

  publish-dev-release:
    needs: [build-debian-dev, build-windows-dev, pack-and-push-nuget-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        shell: bash
        run: |
          mkdir -p release-files
          # actions/upload-artifact preserves subdirectories below the common ancestor of
          # the listed paths - the windows-installer-testing artifact's paths only share
          # deploy/windows/ as their ancestor, so the downloaded files land nested rather
          # than flat. A flat `cp dir/*` only copies top-level entries and silently no-ops
          # on directories, so use find to copy every file regardless of nesting depth.
          find release-artifacts/debian-package-testing release-artifacts/windows-installer-testing -type f -exec cp -v {} release-files/ \;
          echo "Release files ready:"
          ls -lah release-files/

      - name: Tag testing release
        shell: bash
        run: |
          # Force-move Testing tag to current commit
          git tag -f "Testing" "${{ github.sha }}"
          git push origin -f "Testing"

          echo "Tagged as: Testing"

      - name: Delete stale testing release (keep tag)
        shell: bash
        run: |
          gh release delete "Testing" --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create/Update testing release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          tag_name: Testing
          name: Testing
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body: |
            ## Testing Build

            This is an automatically-updated rolling prerelease build from the `dev` branch
            (the integration branch that feature branches land on via `wip` before reaching `main`).

            **Installers:**
            - `videoforensics_*.deb` — Debian/Ubuntu package (self-contained .NET 10 linux-x64)
            - `VideoForensicsSetup.exe` — Windows Inno Setup installer (self-contained .NET 10 win-x64, Server + Desktop Client)

            **Status:** Prerelease, continuously updated. For latest changes see https://github.com/rsperry79/VideoForensics/commits/dev

            All files are accompanied by `.sha256` checksum files for integrity verification.

            **Windows installer signing:** `VideoForensicsSetup.exe` is signed with a self-signed
            certificate (not a public CA, so Windows SmartScreen will still show an
            "Unknown Publisher" prompt on first run - self-signing provides tamper-evidence, not
            OS-level trust). Verify the signer matches this project before running it:

            ```powershell
            (Get-AuthenticodeSignature .\VideoForensicsSetup.exe).SignerCertificate.Thumbprint
            # Expected (SHA1 thumbprint): 8B4907F1FFA309878A3CFED8ACD09D478FDB568C
            ```

            (The `.cer` file's own SHA256 fingerprint is `90:C9:7B:36:3A:F4:3B:EB:08:B1:8D:77:61:9A:7F:2B:03:56:19:9F:6F:6F:06:3D:69:B9:95:23:3E:E0:AC:BD` -
            check that instead if comparing the certificate file directly, e.g. via `openssl x509 -in VideoForensics-CodeSigning.cer -inform DER -noout -fingerprint -sha256`.)

            The public certificate is checked into the repo at
            `deploy/windows/codesign/VideoForensics-CodeSigning.cer`.

  get-version:
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract
        shell: bash
        run: |
          dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          VERSION=$(nbgv get-version -v Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

  publish-nuget:
    needs: [get-version]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pack-nuget-packages.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      github-token: ${{ github.token }}

  # Runs on v* tags and main pushes; dev pushes are handled by publish-dev-release.
  release-installers:
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-installers.yml
    secrets: inherit
