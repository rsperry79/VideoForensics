# Build and release Windows (Inno Setup) and Debian .deb installers from tagged versions.
#
# This workflow builds both installers from the same tagged commit:
# - Windows: self-contained dotnet publish (WebApp win-x64 + MauiApp win-x64) → Inno Setup .exe
# - Debian:  self-contained dotnet publish (linux-x64) → dpkg-based .deb package
#
# Both installers are unsigned (no code-signing certificate yet) — end users will see SmartScreen
# warnings on Windows. Signing will be added as a CI step once a certificate is available.
#
# Windows previously used a WiX v5 MSI + Burn bootstrapper; that was replaced with Inno Setup
# because WiX v5's steward (FireGiant) charges an "Open Source Maintenance Fee" to commercial
# users above a revenue threshold, which this proprietary app likely doesn't qualify to avoid.
# Inno Setup is free for any use, including closed-source commercial software, with no
# revenue-based fee. See deploy/windows/README.md and deploy/windows/VideoForensics.iss.

name: Build and Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # NBGV computes its version via an MSBuild TARGET that runs during actual
      # build execution, not via static property evaluation - `dotnet msbuild
      # -getProperty:Version` only evaluates properties without running targets,
      # so it silently returns the .NET SDK's own default "1.0.0" instead of the
      # real computed version. The `nbgv` CLI tool computes it directly without
      # needing a build, and `-v Version` gives the clean 4-part numeric format
      # (e.g. 1.0.9.44078) that WiX's ProductVersion needs - no +metadata to strip.
      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          VERSION=$(nbgv get-version -v Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Publish WebApp (linux-x64, self-contained)
        run: |
          dotnet publish src/client/web/VideoForensics.WebApp \
            -c Release -r linux-x64 --self-contained true \
            -o /tmp/publish-linux

      - name: Download and bundle cloudflared binary
        # Cloudflare publishes static Linux binaries directly (not via apt), so - same as
        # FFmpeg above - we bundle a copy next to the app binary rather than depend on the
        # user installing it system-wide. CloudflaredTunnelService.ResolveExecutablePath()
        # (via FfmpegPathResolver) prefers this bundled copy over a bare PATH lookup.
        run: |
          curl -fsSL -o /tmp/publish-linux/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/publish-linux/cloudflared

      - name: Build Debian package
        run: |
          chmod +x deploy/debian/build-deb.sh
          ./deploy/debian/build-deb.sh /tmp/publish-linux "${{ steps.extract-version.outputs.version }}"

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          cd deploy/debian
          sha256sum "videoforensics_${{ steps.extract-version.outputs.version }}_amd64.deb" \
            > "videoforensics_${{ steps.extract-version.outputs.version }}_amd64.deb.sha256"
          echo "Generated checksum file:"
          cat "videoforensics_${{ steps.extract-version.outputs.version }}_amd64.deb.sha256"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            deploy/debian/videoforensics_${{ steps.extract-version.outputs.version }}_amd64.deb
            deploy/debian/videoforensics_${{ steps.extract-version.outputs.version }}_amd64.deb.sha256

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # See the bash variant of this step (build-debian job) for why nbgv
      # replaces `dotnet msbuild -getProperty:Version` here.
      - name: Extract version from tag (PowerShell)
        id: extract-version
        shell: pwsh
        run: |
          dotnet tool update --global nbgv
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = nbgv get-version -v Version
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Write-Host "Detected version: $version"

      - name: Publish WebApp (win-x64, self-contained)
        run: |
          dotnet publish src/client/web/VideoForensics.WebApp `
            -c Release -r win-x64 --self-contained true `
            -o publish-win

      - name: Publish MauiApp (win-x64, self-contained)
        run: |
          dotnet publish src/client/maui/VideoForensics.MauiApp `
            -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true `
            -o publish-desktop

      - name: Publish DbSetup (win-x64, self-contained)
        run: |
          dotnet publish src/tools/DbSetup/DbSetup.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish-dbsetup

      - name: Download and bundle FFmpeg binaries
        shell: pwsh
        # IMPORTANT: This URL uses the rolling "latest" GitHub release tag. The exact asset
        # filename and internal zip structure may vary — verify on the first real Windows CI run.
        # Consider pinning to a specific dated release tag (e.g., ffmpeg-2025-01-15) once
        # validated, for build reproducibility.
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) "ffmpeg-btbn-$(Get-Random)"
          $publishDir = "publish-win"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          Write-Host "Downloading FFmpeg from $ffmpegUrl"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "$tempDir\ffmpeg.zip" -ErrorAction Stop

          Write-Host "Extracting to $tempDir"
          Expand-Archive -Path "$tempDir\ffmpeg.zip" -DestinationPath $tempDir -ErrorAction Stop

          # The extracted archive contains a root folder with bin/, docs/, etc.
          $extractedDir = Get-ChildItem -Path $tempDir -Directory -ErrorAction Stop | Select-Object -First 1
          if (-not $extractedDir) {
            Write-Host "ERROR: No directory found in extracted archive"
            exit 1
          }

          $binDir = Join-Path $extractedDir.FullName "bin"
          if (-not (Test-Path $binDir)) {
            Write-Host "ERROR: bin directory not found at $binDir"
            exit 1
          }

          Write-Host "Copying ffmpeg.exe and ffprobe.exe to $publishDir"
          Copy-Item (Join-Path $binDir "ffmpeg.exe") "$publishDir\" -ErrorAction Stop
          Copy-Item (Join-Path $binDir "ffprobe.exe") "$publishDir\" -ErrorAction Stop

          Write-Host "Copying license file as ffmpeg-LICENSE.txt"
          $licenseFile = Get-ChildItem -Path $extractedDir.FullName -Filter "LICENSE*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($licenseFile) {
            Copy-Item $licenseFile.FullName "$publishDir\ffmpeg-LICENSE.txt" -ErrorAction Stop
            Write-Host "  - License: $(Split-Path -Leaf $licenseFile.FullName) -> ffmpeg-LICENSE.txt"
          } else {
            Write-Host "  WARNING: No LICENSE* file found in extracted archive"
          }

          Write-Host "FFmpeg binaries bundled successfully:"
          Get-ChildItem "$publishDir\ffmpeg*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }

          Write-Host "Cleaning up temporary directory"
          Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue

      - name: Download and bundle cloudflared binary
        shell: pwsh
        # Cloudflare publishes cloudflared.exe as a direct GitHub release asset, not via winget/choco
        # by default, so - same as FFmpeg above - we bundle a copy next to the app binary rather than
        # depend on the user installing it system-wide. CloudflaredTunnelService.ResolveExecutablePath()
        # (via FfmpegPathResolver) prefers this bundled copy over a bare PATH lookup.
        run: |
          $cloudflaredUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Write-Host "Downloading cloudflared from $cloudflaredUrl"
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile "publish-win\cloudflared.exe" -ErrorAction Stop
          Write-Host "Bundled cloudflared.exe successfully"

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.extract-version.outputs.version }}"
          $serverDir = (Resolve-Path "publish-win").Path
          $desktopDir = (Resolve-Path "publish-desktop").Path
          $dbSetupDir = (Resolve-Path "publish-dbsetup").Path
          Write-Host "Compiling Inno Setup installer: version=$version server=$serverDir desktop=$desktopDir dbsetup=$dbSetupDir"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" deploy\windows\VideoForensics.iss `
            "/DAppVersion=$version" `
            "/DServerPublishDir=$serverDir" `
            "/DDesktopPublishDir=$desktopDir" `
            "/DDbSetupPublishDir=$dbSetupDir"

      - name: Locate built installer
        shell: pwsh
        run: |
          $exePath = "deploy/windows/bin/VideoForensicsSetup.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "ERROR: Setup exe not found at expected path: $exePath"
            Get-ChildItem "deploy/windows/bin" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Found: $exePath"

      - name: Compute SHA256 checksum (Windows)
        shell: pwsh
        run: |
          $exePath = "deploy/windows/bin/VideoForensicsSetup.exe"
          $exeOut = "deploy/windows/bin/VideoForensicsSetup.exe.sha256"
          $exeHash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          "$exeHash  $(Split-Path -Leaf $exePath)" | Out-File -FilePath $exeOut -Encoding ASCII
          Write-Host "EXE checksum:"
          Get-Content $exeOut

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            deploy/windows/bin/VideoForensicsSetup.exe
            deploy/windows/bin/VideoForensicsSetup.exe.sha256

  create-release:
    runs-on: ubuntu-latest
    needs: [build-debian, build-windows]
    # Only create a GitHub Release on actual version tag pushes, not on workflow_dispatch test runs
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        shell: bash
        run: |
          mkdir -p release-files
          # actions/upload-artifact preserves subdirectories below the common ancestor of
          # the listed paths - the debian-package artifact's paths land nested under
          # deploy/debian/ rather than flat. A flat `cp dir/*` only copies top-level entries
          # and silently no-ops on directories, so use find to copy every file regardless of
          # nesting depth (windows-installer is already flat, but find handles that too).
          find release-artifacts/debian-package release-artifacts/windows-installer -type f -exec cp -v {} release-files/ \;
          echo "Release files ready:"
          ls -lah release-files/

      - name: Extract release notes from CHANGELOG
        id: extract-notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes.md"
          if [ -f CHANGELOG.md ] && grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md entry found for $VERSION; see commit history for details." > "$NOTES_FILE"
          fi
          # Append the unsigned installers disclaimer. Uses individual echo appends
          # rather than a heredoc: a heredoc's content must sit at column 0 to avoid
          # picking up unwanted leading whitespace in the output file, but a bare
          # "***" or other YAML-special character at column 0 inside this `run: |`
          # block scalar gets misparsed as a YAML document/alias token instead of
          # literal text.
          echo "" >> "$NOTES_FILE"
          echo "***" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "**IMPORTANT:** These installers are unsigned. Windows may display SmartScreen warnings on first run. Signing support will be added once a code-signing certificate is available." >> "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: true
          # Draft releases are not auto-published. Review the unsigned installers and
          # publish manually once validated. Signing support (with a code-signing cert)
          # will be added as a CI step later — for now, draft status acknowledges that
          # these binaries are unsigned and should be manually reviewed before publication.
          body_path: release-notes.md
