name: Check JavaScript

# Reusable stage: compiles, lints and tests the TypeScript interop scripts, then checks that the
# committed compiled output matches the sources. Runs the same script as `npm run check`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/client/web/VideoForensics.WebApp/package-lock.json

      - name: Install
        working-directory: src/client/web/VideoForensics.WebApp
        run: npm ci

      - name: Check
        working-directory: src/client/web/VideoForensics.WebApp
        run: npm run check
