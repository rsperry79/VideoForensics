name: CodeQL

on:
  push:
    branches:
      - main
      - wip
  pull_request:
    branches:
      - main
      - wip
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    # windows-latest, not ubuntu-latest: VideoForensics.MauiApp.csproj targets
    # net10.0-windows10.0.19041.0 and cannot restore/build without Windows-only
    # MAUI workloads that aren't available on Linux runners.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Restore
        run: dotnet restore VideoForensics.sln

      - name: Build
        run: dotnet build VideoForensics.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
