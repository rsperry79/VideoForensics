name: main-source-guard

# main only accepts pull requests from this repository's dev branch. Every other change goes into
# dev first (feature branches → dev → main). Make the "only-from-dev" check a required status check
# on main's branch protection/ruleset so a PR from any other branch cannot be merged.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  only-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Require head branch dev from this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from $BASE_REPO:dev (got $HEAD_REPO:$HEAD_REF). Target dev instead."
            exit 1
          fi
          echo "OK: PR comes from $BASE_REPO:dev"
